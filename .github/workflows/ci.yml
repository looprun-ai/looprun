name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: pnpm -r --if-present typecheck
      # The engine proofs, the structural lints and the facade gates are ordinary vitest
      # files: they RUN on every push and pull request, not merely exist.
      - run: pnpm -r --if-present test
      # The words the whole tree is allowed to use.
      - run: pnpm gates
